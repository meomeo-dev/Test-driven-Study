schema_version: 1
review_date: '2026-11-01'
status: initial_proposal
implementation_overrides: ../image-generation/README.md
implementation_status: see_current_feature_documentation
scope:
  users: personal_single_user
  deployment: local_machine
  startup_command: npm run dev
  backend_language: Go
  frontend_language: TypeScript
  inference_location: external_provider_api
  initial_prerequisites: [Node_26_LTS, npm, compatible_Go_toolchain]
  initial_services: [Vite_dev_server, Go_HTTP_process]
  database_server_required: false
  containers_required: false
  paid_provider_requests_executed: false
selection_basis:
  local_evidence: local-evidence.json
  reasoning: Fit the confirmed local requirements before sample popularity.
  versions: Pin compatible stable releases during implementation.
  security: Advisory and installed-transitive review remains an implementation gate.
  license_scope: Licenses below describe projects, not every future transitive package.
runtime_choices:
  - name: react_and_react_dom
    license: MIT
    purpose: Interactive quiz, exam, analysis, and image screens.
    rationale: Compatible with the selected routing and component ecosystem.
    alternatives: [Vue_with_Vite]
    boundary: Frontend rendering and local UI state.
    exit_condition: Team preference or a demonstrated ecosystem mismatch.
    sources:
      - https://react.dev/learn/build-a-react-app-from-scratch
      - https://github.com/react/react/blob/main/LICENSE
  - name: react_router
    license: MIT
    purpose: Declarative routes and layouts.
    rationale: No server framework or route-generation plugin is required.
    alternatives: [TanStack_Router]
    boundary: URL matching and navigation; Query owns fetched server state.
    exit_condition: Typed URL/search state becomes a material requirement.
    sources:
      - https://reactrouter.com/start/modes
      - https://github.com/remix-run/react-router/blob/main/LICENSE.md
  - name: tanstack_react_query
    license: MIT
    purpose: Server-state fetching, mutations, invalidation, and job polling.
    rationale: Avoid ad hoc request lifecycle state and a duplicate global store.
    alternatives: [native_fetch_with_component_state]
    boundary: HTTP data cache; exam authority remains in Go.
    exit_condition: The app no longer benefits from shared asynchronous server state.
    constraints:
      - Set freshness and refetch policy per resource.
      - Preserve versioned active-exam snapshots and unsaved answers.
    sources:
      - https://tanstack.com/query/latest/docs/framework/react/overview
      - https://tanstack.com/query/latest/docs/framework/react/guides/important-defaults
      - https://github.com/TanStack/query/blob/main/LICENSE
  - name: tailwind_and_selected_shadcn_components
    license: MIT
    purpose: UI styling and selected accessible component primitives.
    rationale: Copy needed component source; avoid a whole application template.
    alternatives: [CSS_modules, Mantine]
    boundary: Styling and components; no learning logic.
    exit_condition: Component maintenance or accessibility cost exceeds its value.
    constraints:
      - Use the Radix variant consistently for this proposed implementation.
      - Other shadcn variants exist; Radix is a choice, not a universal property.
    sources:
      - https://tailwindcss.com/docs/installation/using-vite
      - https://ui.shadcn.com/docs/installation/vite
      - https://github.com/shadcn-ui/ui/blob/main/LICENSE.md
      - https://github.com/tailwindlabs/tailwindcss/blob/main/LICENSE
  - name: recharts
    license: MIT
    purpose: Learning trend and chapter-comparison charts.
    rationale: React components fit the chosen shadcn chart approach.
    alternatives: [Apache_ECharts]
    boundary: Chart components; SQL produces metric values.
    exit_condition: Required chart types or measured rendering limits exceed its fit.
    constraints:
      - Match react-is to the installed React version.
      - Provide readable values beyond color and chart geometry.
    sources:
      - https://github.com/recharts/recharts
      - https://github.com/recharts/recharts/blob/main/LICENSE
  - name: go_standard_library
    license: BSD_3_Clause
    purpose: HTTP routing, JSON validation, logging, files, and cancellation.
    rationale: Method/path routing and standard handlers meet the current scope.
    alternatives: [chi, Gin]
    boundary: Transport; learning calculations stay in ordinary Go functions.
    exit_condition: Route composition has a concrete maintenance problem.
    sources:
      - https://go.dev/blog/routing-enhancements
      - https://pkg.go.dev/net/http
      - https://go.dev/LICENSE
  - name: modernc_org_sqlite
    license: BSD_3_Clause
    purpose: Embedded SQLite through database/sql without CGO.
    rationale: No database service or C compiler in the baseline startup path.
    alternatives: [mattn_go_sqlite3, PostgreSQL_with_pgx]
    boundary: Database access through SQL and generated bindings.
    exit_condition: Measured contention, concurrent users, or driver compatibility issues.
    constraints:
      - Preserve the driver-declared modernc.org/libc compatibility relationship.
      - Check the actual embedded SQLite engine on upgrades.
    sources:
      - https://pkg.go.dev/modernc.org/sqlite
      - https://gitlab.com/cznic/sqlite
  - name: goose_library
    license: MIT
    purpose: Apply embedded SQL migrations on application startup.
    rationale: No separately installed migration command is needed by the user.
    alternatives: [ordered_application_owned_SQL_migrations]
    boundary: Versioned schema migration only.
    exit_condition: Unsupported migration behavior or an unacceptable dependency graph.
    sources:
      - https://pkg.go.dev/github.com/pressly/goose/v3#NewProvider
      - https://github.com/pressly/goose/blob/main/LICENSE
  - name: openai_go
    license: Apache_2_0
    purpose: Structured advice, selected-image understanding, and image requests.
    rationale: One official Go SDK covers the required hosted capabilities.
    alternatives: [Google_Gen_AI_Go, Anthropic_Go_for_text_plus_image_provider]
    boundary: Separate text-advice and image-request functions with application types.
    exit_condition: Evaluated quality, eligibility, cost, or API availability fails requirements.
    constraints:
      - Keep model IDs configurable and secrets outside frontend bundles.
      - Coordinate SDK retries with the persisted job policy.
      - Structured output still requires semantic validation in Go.
    sources:
      - https://github.com/openai/openai-go
      - https://developers.openai.com/api/docs/guides/structured-outputs
      - https://developers.openai.com/api/docs/guides/image-generation
development_choices:
  - name: TypeScript
    license: Apache_2_0
    purpose: Strict compile-time frontend checking.
    rationale: Required frontend language with broad library support.
    alternatives: []
    exit_condition: A future explicit language requirement changes.
    source: https://github.com/microsoft/TypeScript/blob/main/LICENSE.txt
  - name: vite_and_official_react_plugin
    license: MIT
    purpose: Frontend development, React integration, and static builds.
    rationale: A Go backend makes a Node application server unnecessary.
    alternatives: [Next_js, other_static_bundler]
    exit_condition: Public server-rendered content becomes a real requirement.
    sources: [https://vite.dev/guide/, https://github.com/vitejs/vite-plugin-react]
  - name: concurrently
    license: MIT
    purpose: Start Vite and Go under one npm command with coordinated shutdown.
    rationale: Reuse established process supervision behavior.
    alternatives: [Node_child_process_launcher]
    exit_condition: A packaged Go executable replaces the development launcher.
    source: https://github.com/open-cli-tools/concurrently
  - name: openapi_typescript
    license: MIT
    purpose: Generate frontend declarations from the Go-owned HTTP contract.
    rationale: Avoid manually synchronized API type copies.
    alternatives: [another_OpenAPI_generator]
    exit_condition: The selected HTTP contract tooling changes.
    constraints: [Generated_types_do_not_validate_runtime_payloads]
    source: https://openapi-ts.dev/introduction
  - name: sqlc
    license: MIT
    purpose: Generate checked Go query methods for SQLite analytics.
    rationale: Retain explicit SQL without handwritten scan/binding repetition.
    alternatives: [handwritten_database_sql_queries, GORM]
    exit_condition: Unsupported SQL or generator upkeep outweighs query safety.
    sources:
      - https://docs.sqlc.dev/en/stable/tutorials/getting-started-sqlite.html
      - https://github.com/sqlc-dev/sqlc
  - name: vitest
    license: MIT
    purpose: Meaningful frontend state and transformation checks.
    rationale: Shares the Vite TypeScript environment.
    alternatives: [Node_test_runner]
    exit_condition: No remaining Vite-specific or browser-component test need.
    source: https://vitest.dev/guide/
  - name: playwright
    license: Apache_2_0
    purpose: Browser workflows against the real local Go service.
    rationale: Check persistence, resume, submission, and keyboard behavior end to end.
    alternatives: [manual_browser_acceptance]
    exit_condition: Another browser runner provides an established project advantage.
    source: https://playwright.dev/docs/browsers
local_data_policy:
  immutable_inputs: [courses/]
  database_path: var/study.sqlite
  generated_images_path: var/generated-images
  source_referenced_images_missing: 135
  source_subject_1_images_missing: 86
  connection_pool_initial_max_open: 1
  foreign_keys: enabled_on_every_connection
  busy_timeout: bounded
  initial_journal_mode: default_rollback
  wal_adoption: Only after measured benefit; use a patched embedded engine.
  wal_fixed_engine_reference: https://www.sqlite.org/wal.html#walreset
  backup_reference: https://www.sqlite.org/backup.html
ai_policy:
  initial_provider: OpenAI
  text_candidate: gpt-6-luna
  image_candidate: gpt-image-2.5-flare
  stronger_text_evaluation_candidate: gpt-6.1-sol
  model_access_tested: false
  chinese_image_quality_benchmarked: false
  model_ids_are_configurable: true
  recommendation_authority: Go_metrics_and_answer_keys
  request_timing: explicit_advice_request_or_session_summary
  image_concurrency: 1
  image_output_cache: successful_same_input_specification
  prompt_template: data/memory-palace-prompt-template.v1.json
  prompt_policy: Full_template_with_variable_substitution_only
  recommendation_validation:
    - Question IDs exist and match the subject.
    - Reported metrics reference the supplied snapshot.
    - Model output cannot overwrite answer keys or deterministic scores.
  image_job_states: [queued, running, succeeded, failed, cancelled, outcome_unknown]
  image_job_policy:
    - Persist job and request together with a unique local request ID.
    - Provider requests run outside database transactions.
    - Save temporary output and rename before marking success.
    - Persisted job state is authoritative; initial UI uses polling.
    - Interrupted paid requests require reconciliation or explicit retry.
    - Cancellation does not guarantee provider work or billing stopped.
    - Apply one bounded retry budget across SDK and worker.
  price_policy: Configurable dated price table; retain returned usage.
deferred:
  infrastructure: [PostgreSQL, Redis, River, Asynq, object_storage, Docker]
  ai: [AI_SDK_UI, LangGraph, Mastra, CrewAI, n8n, Genkit_Go, vector_database]
  visual: [React_Flow, Three_js, React_Three_Fiber, canvas_editor]
  ui: [Next_js, TanStack_Router, Zod, Redux, Zustand, standalone_AI_Elements]
  triggers:
    infrastructure: Concurrent users/workers, shared deployment, or measured contention.
    agents: A specified multi-step tool workflow exceeds ordinary Go composition.
    canvas: Users need to edit images or workflow graphs.
    three_dimensional: Users need an actual interactive 3D environment.
  license_notes:
    River: MPL-2.0 core with separately commercial Pro features.
    tldraw: Default development license is not an unrestricted production MIT grant.
    AI_Elements: Separate project announces deprecation at end of November 2026.
