schema_version: 1
id: course-learning-paths
title: Course knowledge graphs and learning paths
status: completed
progress_revision: 48
created_at: 2026-11-13
updated_at: 2026-11-13
source_assessment: docs/features/learning-path/README.md reviewed by three
  design reviewers at 489ffdc
objective: Courses declare concept graphs with AND/OR prerequisites, and each
  learner can generate, follow and replan a saved learning path driven by
  practice evidence, piloted on Beginner English.
execution_contract:
  scheduling: serial
  max_in_progress_work_units: 1
  unit_definition: A dependency-ordered change that can be accepted, committed and
    reverted independently.
  completion_rule: Complete all four phases before starting the next unit.
  forbidden_batching:
    - Close the current work unit before dispatching its successor.
  change_boundary:
    - Use the primary checkout and the issue branch; no worktrees.
    - Use isolated databases and local fixtures for verification.
  mode: plan-todo
phase_contract:
  order:
    - prepare
    - migrate
    - verify
    - close
  status_enum:
    - not-started
    - in-progress
    - completed
    - blocked
  transition_rules:
    - Complete phases in order.
  required_progress_fields:
    - status
    - started_at
    - completed_at
    - evidence
    - notes
  update_protocol:
    before_phase:
      - Increment progress_revision and set the active phase.
    after_phase:
      - Record evidence and update recovery.
    on_blocked:
      - Record the blocker and its recovery condition.
    after_compaction:
      - Resume from recovery.next_action.
status_model:
  work_unit_status_enum:
    - not-started
    - in-progress
    - completed
    - blocked
  plan_status_enum:
    - draft
    - ready
    - in-progress
    - completed
    - blocked
  optional_unit_rule: Optional units require an explicit activation decision.
resume:
  current_work_unit: null
  active_todo: null
  current_phase: null
  last_completed_work_unit: WU-006
  next_work_unit: null
  next_action: PLAN completed; no further work unit is pending.
  last_checkpoint: WU-006.close.completed
  blockers: []
invariants:
  - id: I-001
    statement: Packages own concept graphs, the learner database owns marks and
      paths, and application code owns mastery and planning.
  - id: I-002
    statement: Packages without concepts keep their digests, routes, grading and
      history, including Yunnan driving.
  - id: I-003
    statement: Item IDs, attempts, exam snapshots and learner data remain readable;
      every attempt remains a separate record.
  - id: I-004
    statement: Concept tags never reach learner-facing question JSON or AI prompts.
  - id: I-005
    statement: Verification uses isolated data and local fixtures; item drafting
      tools receive course content only, never source code.
verification_profiles:
  packages:
    automated:
      - command: go test ./internal/course ./internal/storage ./internal/study
        expected: Validation, digest and projection tests pass.
      - command: npm run course:check -- tests/fixtures/courses/concept-graph
        expected: The fixture validates and reports concept counts.
    manual_tier: focused
  service:
    automated:
      - command: npm run generate:db && go test ./internal/study ./internal/storage
        expected: Planner, state and path tests pass with current bindings.
    manual_tier: focused
  http:
    automated:
      - command: npm run generate:api && go test ./internal/httpapi && npm run typecheck
        expected: Handlers, contract types and frontend types agree.
    manual_tier: focused
  ui:
    automated:
      - command: npm run test:unit && npm run typecheck && npx playwright test
          tests/browser/learning-path.spec.ts
        expected: Layout tests and the learning-path browser spec pass.
    manual_tier: focused
  course:
    automated:
      - command: npm run course:check -- courses/beginner-english
        expected: Beginner English 1.1.0 validates with the planned graph.
    manual_tier: focused
  release:
    automated:
      - command: npm run check
        expected: The full acceptance gate passes.
    manual_tier: full
manual_gates:
  focused:
    - Review actual changes, isolated acceptance and the rollback commit.
  full:
    - Verify the learning page on the pilot course and regression of existing
      courses on isolated data.
