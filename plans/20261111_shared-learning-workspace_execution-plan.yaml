schema_version: 1
id: shared-learning-workspace
title: Unify the learning workspace across courses
status: completed
progress_revision: 40
created_at: 2026-11-11
updated_at: 2026-11-11
source_assessment: docs/features/course-platform/shared-learning-workspace.md
objective: Run the full Yunnan driving learning experience for every installed
  course through shared feature code and isolated course data.
execution_contract:
  scheduling: serial
  max_in_progress_work_units: 1
  unit_definition: One independently verified and recoverable change.
  completion_rule: Complete all four phases before starting the next unit.
  forbidden_batching:
    - Complete each work unit before dispatching its successor.
  change_boundary:
    - Use the primary checkout and ordinary issue branch.
    - Run against isolated data and local provider fixtures.
  mode: plan-todo
phase_contract:
  order:
    - prepare
    - migrate
    - verify
    - close
  status_enum:
    - not-started
    - in-progress
    - completed
    - blocked
  transition_rules:
    - Complete phases in order.
  required_progress_fields:
    - status
    - started_at
    - completed_at
    - evidence
    - notes
  update_protocol:
    before_phase:
      - Increment progress_revision and set the active phase.
    after_phase:
      - Record evidence and update recovery.
    on_blocked:
      - Record the blocker and its recovery condition.
    after_compaction:
      - Resume from recovery.next_action.
status_model:
  work_unit_status_enum:
    - not-started
    - in-progress
    - completed
    - blocked
  plan_status_enum:
    - draft
    - ready
    - in-progress
    - completed
    - blocked
  optional_unit_rule: Optional units require an explicit activation decision.
resume:
  current_work_unit: null
  active_todo: null
  current_phase: null
  last_completed_work_unit: WU-004
  next_work_unit: null
  next_action: PLAN completed; no further work unit is pending.
  last_checkpoint: WU-004.close.completed
  blockers: []
invariants:
  - id: I-001
    statement: All courses share the study, review, exam, guide and AI workflows.
  - id: I-002
    statement: Questions, learner state, media and AI history resolve within the
      selected course.
  - id: I-003
    statement: Legacy records retain their identity, grading, timestamps, and
      recovery semantics.
  - id: I-004
    statement: Course packages contain data and the application owns execution and
      provider policy.
verification_profiles:
  identity:
    automated:
      - command: npm run test:go
        expected: The work unit's independent acceptance passes.
    manual_tier: focused
  workspace:
    automated:
      - command: npm run typecheck and focused browser checks
        expected: The work unit's independent acceptance passes.
    manual_tier: focused
  features:
    automated:
      - command: Go tests and focused exam and AI browser checks
        expected: The work unit's independent acceptance passes.
    manual_tier: focused
  release:
    automated:
      - command: npm run check
        expected: The work unit's independent acceptance passes.
    manual_tier: full
manual_gates:
  focused:
    - Review actual changes, isolated acceptance and rollback.
  full:
    - Verify feature parity, scoped persistence, and recovery across courses.
baseline:
  captured_at: 2026-11-11
  git_head: db50f036a36cbb3ca80ce74a6e21ee36dcc1d2fb
  working_tree_note: Clean main at db50f03 before saving the approved design. The
    learner's running application is kept separate from tests.
  results:
    route: PLAN-TODO[*]
    estimated_minutes: 450
work_units:
  - id: WU-001
    title: Course-scoped identities and history
    activation: required
    status: completed
    depends_on: []
    todo_binding:
      required: true
      rationale: Preserve changes and acceptance across interrupted execution.
      creation_phase: prepare
    verification_profile: identity
    intent: Attach persistent item and unit identities to installed packages and
      consolidate existing typed practice history.
    file_group:
      modify:
        - internal/storage/
        - internal/study/
        - db/
    phase_requirements:
      prepare:
        - Confirm contracts, affected paths, and compatibility checks.
      migrate:
        - Attach persistent item and unit identities to installed packages and
          consolidate existing typed practice history.
      verify:
        - A migrated database keeps original grades, deadlines and references,
          and overlapping course IDs remain isolated.
      close:
        - Record actual files, independent acceptance and a reversible Git
          reference.
    independent_acceptance:
      - A migrated database keeps original grades, deadlines and references, and
        overlapping course IDs remain isolated.
    progress:
      prepare:
        status: completed
        started_at: 2026-11-11T10:04:00.672Z
        completed_at: 2026-11-11T10:04:02.055Z
        evidence:
          - PLAN-TODO created the active TODO binding before local WU execution.
          - Inventory original question foreign keys, course version mapping,
            immutable practice rows and subject-specific exam constraints.
        notes: []
      migrate:
        status: completed
        started_at: 2026-11-11T10:04:03.512Z
        completed_at: 2026-11-11T10:09:47.762Z
        evidence:
          - Migration 11 and history import are ready for isolated validation.
          - Stored snapshots in an additive table and corrected the migration 4
            fixture to start at its actual baseline.
        notes: []
      verify:
        status: completed
        started_at: 2026-11-11T10:09:49.460Z
        completed_at: 2026-11-11T10:10:20.298Z
        evidence:
          - All other Go packages passed. Two storage fixtures failed while
            constructing legacy data.
          - Go packages passed after rerunning storage with corrected historical
            fixtures. Added proof of stable overlapping item IDs and single
            import of an existing numeric grade.
        notes:
          - "Blocked: Historical test construction used current generated
            practice columns and an already projected generic bank."
      close:
        status: completed
        started_at: 2026-11-11T10:10:22.168Z
        completed_at: 2026-11-11T10:10:24.757Z
        evidence:
          - Migration verified against historical fixtures and repeated startup.
          - "Independent acceptance passed: A migrated database keeps original
            grades, deadlines and references, and overlapping course IDs remain
            isolated."
        notes: []
    recovery:
      last_completed_phase: close
      next_action: Continue WU-001.close.
      changed_files:
        - internal/storage/migrations/00011_shared_workspace.sql
        - internal/storage/workspace.go
      rollback_ref: 21d21e4
      blockers: []
    squad:
      pm:
        id: root
        role: Planning
        focus: Maintain feature parity and scope.
      senior_engineer:
        id: root
        role: Implementation
        focus: Deliver the shared application.
      ca_qa_lead:
        id: root
        role: Acceptance
        focus: Verify course isolation and compatibility.
  - id: WU-002
    title: Shared workspace and typed practice
    activation: required
    status: completed
    depends_on:
