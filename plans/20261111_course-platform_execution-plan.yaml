      rollback_ref: 213f5ce (pre-implementation baseline)
      blockers: []
    squad:
      pm:
        id: root
        role: Planning
        focus: Preserve scope, dependencies, and compatibility.
      senior_engineer:
        id: root
        role: Implementation
        focus: Deliver the current work unit.
      ca_qa_lead:
        id: root
        role: Acceptance
        focus: Check regression evidence and rollback.
