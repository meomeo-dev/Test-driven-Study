schema_version: 1
id: course-platform
title: Course platform migration
status: completed
progress_revision: 36
created_at: 2026-11-11
updated_at: 2026-11-11
source_assessment: Repository investigation at 08e65d8 and approved split proposal
objective: Run multiple independently maintained course packages in one offline
  Go and React study application while preserving Yunnan driving history and
  behavior.
execution_contract:
  scheduling: serial
  max_in_progress_work_units: 1
  unit_definition: A dependency-ordered increment that can be accepted, committed,
    and reverted independently.
  completion_rule: Complete all four phases before starting the next unit.
  forbidden_batching:
    - Close the current work unit before dispatching its successor.
  change_boundary:
    - Use the primary checkout and an ordinary issue branch.
    - Use isolated databases and local provider fixtures for verification.
  mode: plan-todo
phase_contract:
  order:
    - prepare
    - migrate
    - verify
    - close
  status_enum:
    - not-started
    - in-progress
    - completed
    - blocked
  transition_rules:
    - Complete phases in order.
  required_progress_fields:
    - status
    - started_at
    - completed_at
    - evidence
    - notes
  update_protocol:
    before_phase:
      - Increment progress_revision and set the active phase.
    after_phase:
      - Record evidence and update recovery.
    on_blocked:
      - Record the blocker and its recovery condition.
    after_compaction:
      - Resume from recovery.next_action.
status_model:
  work_unit_status_enum:
    - not-started
    - in-progress
    - completed
    - blocked
  plan_status_enum:
    - draft
    - ready
    - in-progress
    - completed
    - blocked
  optional_unit_rule: Optional units require an explicit activation decision.
resume:
  current_work_unit: null
  active_todo: null
  current_phase: null
  last_completed_work_unit: WU-004
  next_work_unit: null
  next_action: PLAN completed; no further work unit is pending.
  last_checkpoint: WU-004.close.completed
  blockers: []
invariants:
  - id: I-001
    statement: Course packages contain local data and media. Application code owns
      scoring, authorization and provider policy.
  - id: I-002
    statement: Original question and option identities, historical grades, exam
      deadlines and AI task recovery remain readable.
  - id: I-003
    statement: External IDs and assets are scoped to the course. A rejected update
      leaves installed content and records valid.
  - id: I-004
    statement: Study and assessment work without a remote provider. Active
      unanswered exam responses use a public question projection.
verification_profiles:
  course:
    automated:
      - command: go test ./internal/course ./cmd/course
        expected: Package structure, semantic checks, scaffold and Yunnan parity pass.
    manual_tier: focused
  storage:
    automated:
      - command: npm run test:go
        expected: Fresh import, legacy migration and scoped assets pass on isolated data.
    manual_tier: focused
  practice:
    automated:
      - command: npm run typecheck && npm run test:e2e
        expected: Types and two-course learner flows pass.
    manual_tier: focused
  release:
    automated:
      - command: npm run check
        expected: Generated contracts, unit, build, startup and browser gates pass.
    manual_tier: full
manual_gates:
  focused:
    - Record the tested boundary, actual files and reversible commit point.
  full:
    - Confirm fresh course onboarding, preserved legacy recovery and both
      production deep links.
baseline:
  captured_at: 2026-11-11
  git_head: 08e65d8c525e496602e6db407b4013612aee9569
  working_tree_note: Clean main before plan creation. Learner data and running
    services are out of scope.
  results:
    source_bank: 3,147 questions and 1,359 unique existing media references verified
    route: PLAN-TODO[*]
    estimated_minutes: 420
work_units:
  - id: WU-001
    title: Versioned course packages and authoring
    activation: required
    status: completed
    depends_on: []
    todo_binding:
      required: true
      rationale: Persist implementation and acceptance evidence for this boundary.
      creation_phase: prepare
    verification_profile: course
    intent: Define the v1 resource contract, course loader and authoring CLI.
      Produce the Yunnan package from preserved source material.
    file_group:
      modify:
        - contracts/course/v1/
        - internal/course/
        - cmd/course/
        - courses/yunnan-driving/
        - package.json
        - docs/dependencies.yaml
    phase_requirements:
      prepare:
        - Freeze item identity, answer types, manifest and asset rules with
          regression cases.
      migrate:
        - Implement shared validation, deterministic conversion, and the
          course:new and course:check commands.
      verify:
        - Check the full Yunnan bank and scaffold a valid temporary course with
          a numeric item.
      close:
        - Record actual files, independent acceptance and a reversible Git
          reference.
    independent_acceptance:
      - The validated package represents all 3,147 source questions and 1,359
        referenced media.
      - The same loader accepts scaffolded content and rejects invalid package
        references.
    progress:
      prepare:
        status: completed
        started_at: 2026-11-11T07:41:06.455Z
        completed_at: 2026-11-11T07:41:20.647Z
        evidence:
          - PLAN-TODO created the active TODO binding before local WU execution.
          - "Issue #37, course identities, four response variants and package
            path invariants recorded in the plan."
        notes: []
      migrate:
        status: completed
        started_at: 2026-11-11T07:41:22.213Z
        completed_at: 2026-11-11T07:47:40.405Z
        evidence:
