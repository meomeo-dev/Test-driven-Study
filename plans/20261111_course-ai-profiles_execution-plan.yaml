schema_version: 1
id: course-ai-profiles
title: Load AI teaching profiles by course version
status: completed
progress_revision: 28
created_at: 2026-11-11
updated_at: 2026-11-11
source_assessment: docs/features/course-platform/course-ai-prompts.md
objective: Let each installed course version supply assistant guidance and a
  memory palace template under a common execution protocol.
execution_contract:
  scheduling: serial
  max_in_progress_work_units: 1
  unit_definition: One independently verified and recoverable change.
  completion_rule: Complete all four phases before starting the next unit.
  forbidden_batching:
    - Complete each work unit before dispatching its successor.
  change_boundary:
    - Use the primary checkout and ordinary issue branch.
    - Run against isolated data and local provider fixtures.
  mode: plan-todo
phase_contract:
  order:
    - prepare
    - migrate
    - verify
    - close
  status_enum:
    - not-started
    - in-progress
    - completed
    - blocked
  transition_rules:
    - Complete phases in order.
  required_progress_fields:
    - status
    - started_at
    - completed_at
    - evidence
    - notes
  update_protocol:
    before_phase:
      - Increment progress_revision and set the active phase.
    after_phase:
      - Record evidence and update recovery.
    on_blocked:
      - Record the blocker and its recovery condition.
    after_compaction:
      - Resume from recovery.next_action.
status_model:
  work_unit_status_enum:
    - not-started
    - in-progress
    - completed
    - blocked
  plan_status_enum:
    - draft
    - ready
    - in-progress
    - completed
    - blocked
  optional_unit_rule: Optional units require an explicit activation decision.
resume:
  current_work_unit: null
  active_todo: null
  current_phase: null
  last_completed_work_unit: WU-003
  next_work_unit: null
  next_action: PLAN completed; no further work unit is pending.
  last_checkpoint: WU-003.close.completed
  blockers: []
invariants:
  - id: I-001
    statement: The installed question version resolves private teaching files
      independently of model settings and provider policy.
  - id: I-002
    statement: Previous replies and image jobs retain their provenance and saved
      prompts after course upgrades.
  - id: I-003
    statement: Legacy courses, local transcript evidence, and source restrictions
      remain supported.
verification_profiles:
  packages:
    automated:
      - command: go test ./internal/course ./internal/storage
        expected: Profile validation and immutable retrieval pass.
    manual_tier: focused
  execution:
    automated:
      - command: npm run test:go and npm run check:generated
        expected: Both AI entry points and persistence pass.
    manual_tier: focused
  release:
    automated:
      - command: npm run check
        expected: Full acceptance passes with local providers.
    manual_tier: full
manual_gates:
  focused:
    - Review actual changes, isolated acceptance and rollback.
  full:
    - Verify feature parity, scoped persistence, and recovery across courses.
baseline:
  captured_at: 2026-11-11
  git_head: 3d9c39c6c291deb54a18c6f20b2828dd14533772
  working_tree_note: Clean main before the plan. The live learner service and paid
    providers are separate from verification.
  results:
    route: PLAN-TODO[*]
    estimated_minutes: 195
