    status: active
  - id: accessibility-baseline
    title: 可访问性基线（Accessibility Baseline）
    path: references/accessibility-baseline.md
    kind: reference
    summary: >-
      WCAG 2.2 的对比度（1.4.3、1.4.6、1.4.11）、颜色（1.4.1）、目标尺寸 24×24（2.5.8）、焦点
      不被遮挡（2.4.11）与顺序条款的级别与阈值；地标、焦点环、复合控件焦点管理与 F6 惯例的出处。
    aliases: [WCAG, 对比度, contrast, 目标尺寸, target size, 焦点, focus, landmark, roving tabindex, F6]
    source: >-
      https://www.w3.org/TR/WCAG22/ ;
      https://www.w3.org/WAI/WCAG22/Understanding/target-size-minimum.html ;
      https://www.w3.org/WAI/ARIA/apg/practices/keyboard-interface/ ;
      https://learn.microsoft.com/en-us/windows/apps/design/accessibility/keyboard-accessibility
    verified_at: 2026-11-17
    review_after_days: 365
    status: active
  - id: design-systems-and-tokens
    title: 企业设计体系的密度模式与设计令牌（Design Systems and Tokens）
    path: references/design-systems-and-tokens.md
    kind: reference
    summary: >-
      公开设计体系的密度档位与表格行高（24/32/40/48/64、Cozy 44 px 触控区等）、间距与颜色命名的
      共同做法、令牌三层结构、用根节点属性切换主题与密度、DTCG 2025.10 格式的地位与字段规则。
    aliases: [密度, density, compact, 紧凑, 行高, row height, 设计令牌, design tokens, DTCG, 深色主题]
    source: >-
      https://carbondesignsystem.com/components/data-table/style/ ;
      https://www.sap.com/design-system/fiori-design-web/v1-136/foundations/visual/cozy-compact ;
      https://www.lightningdesignsystem.com/2e1ef8501/p/805bbe-display-density ;
      https://opensource.adobe.com/spectrum-web-components/tools/theme/ ;
      https://ant.design/docs/react/customize-theme/ ;
      https://fluent2.microsoft.design/design-tokens ;
      https://www.w3.org/community/reports/design-tokens/CG-FINAL-format-20251028/ ;
      标「经验」的条目为多个体系共同做法的归纳，没有单一出处
