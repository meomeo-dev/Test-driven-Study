  - id: platform-conventions
    title: macOS 与 Windows 平台规范（Platform Conventions）
    path: references/platform-conventions.md
    kind: reference
    summary: >-
      macOS 文字样式表（字号/行高/字重）、菜单栏与标准快捷键、侧边栏层级与审核条款 2.5.1；Windows
      type ramp、4 epx 间距、圆角、触控目标、标题栏高度与 Mica/Acrylic；跨平台字体栈与快捷键写法。
    aliases: [HIG, 平台规范, 字号, type ramp, 标题栏, 菜单栏, 快捷键, Mica, Acrylic, Segoe UI, SF Pro]
    source: >-
      https://developer.apple.com/design/human-interface-guidelines/typography ;
      https://developer.apple.com/design/human-interface-guidelines/layout ;
      https://developer.apple.com/design/human-interface-guidelines/keyboards ;
      https://developer.apple.com/design/human-interface-guidelines/sidebars ;
      https://developer.apple.com/design/human-interface-guidelines/the-menu-bar ;
      https://developer.apple.com/app-store/review/guidelines/ ;
      https://learn.microsoft.com/en-us/windows/apps/design/signature-experiences/typography ;
      https://learn.microsoft.com/en-us/windows/apps/design/basics/content-basics ;
      https://learn.microsoft.com/en-us/windows/apps/design/signature-experiences/geometry ;
      https://learn.microsoft.com/en-us/windows/apps/develop/input/guidelines-for-targeting ;
      https://learn.microsoft.com/en-us/windows/apps/design/basics/titlebar-design ;
      https://learn.microsoft.com/en-us/windows/apps/desktop/modernize/ui/apply-snap-layout-menu ;
      https://learn.microsoft.com/en-us/windows/apps/design/style/mica ;
      https://learn.microsoft.com/en-us/windows/apps/design/style/acrylic
