      https://github.com/palantir/blueprint/wiki/React-19-Support ;
      https://base-ui.com/react/overview/releases/v1-0-0 ;
      https://github.com/ariakit/ariakit/releases/tag/@ariakit/react@0.1.0 ;
      https://react-aria.adobe.com/ ;
