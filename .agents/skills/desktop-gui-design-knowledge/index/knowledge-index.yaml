    review_after_days: 90
    status: active
  - id: layout-and-regions
    title: 功能分区与布局（Layout and Regions）
    path: references/layout-and-regions.md
    kind: reference
    summary: >-
      五块通用骨架，导航栏、列表栏、工具栏、工作区、检查器、底部面板、状态栏各放什么不放什么，
      页签与分隔条规则，布局保存与重置，主窗口加常驻小窗的分工与窗口属性。
    aliases: [功能分区, 布局, layout, 检查器, inspector, 状态栏, 底部面板, 导航栏, 常驻小窗, 停靠]
    source: >-
      经验归纳：桌面专业软件公开界面的共同做法，按区域总结；侧边栏层级与分栏规则见条目
      platform-conventions 的来源；数值未逐条核实
    verified_at: 2026-11-17
    review_after_days: 365
    status: active
  - id: visual-hierarchy-and-dense-tables
    title: 视觉与文字层级、高密度表格（Visual Hierarchy and Dense Tables）
    path: references/visual-hierarchy-and-dense-tables.md
    kind: reference
    summary: >-
      视觉层级手段、四级文字层级与三档明度；高密度表格的对齐、等宽数字、分隔、冻结、
      极值标记、空单元格、概览到细节的组织、键盘、虚拟滚动与空态加载态错误态。
    aliases: [视觉层级, 文字层级, 字号, 表格, data table, tabular-nums, 斑马纹, 空状态, 骨架屏]
    source: >-
      Shneiderman, B. (1996) The Eyes Have It: A Task by Data Type Taxonomy for Information
      Visualizations, IEEE Symposium on Visual Languages, pp. 336-343 ;
      https://developer.mozilla.org/en-US/docs/Web/CSS/font-variant-numeric ;
      其余为经验归纳，文字层级字号未核实
    verified_at: 2026-11-17
    review_after_days: 365
    status: active
  - id: interaction-layers
    title: 披露、反馈、键盘、结构与叠放层级（Interaction Layers）
