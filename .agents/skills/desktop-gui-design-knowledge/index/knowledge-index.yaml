      结构层级的边界手段，z-order 顺序、公开库之间的差异与叠放令牌示例。
    aliases: [披露层级, progressive disclosure, tooltip, popover, modal, toast, 反馈, 快捷键, 命令面板, z-index, z-order, 叠放]
