    review_after_days: 180
    status: active
  - id: react-component-libraries
    title: React 组件库与无样式原语（React Component Libraries）
    path: references/react-component-libraries.md
    kind: reference
    summary: >-
      无样式原语、完整组件库、分栏与停靠、命令面板、表格逻辑与虚拟滚动各包的许可证、最新版本与
      发布日期快照、覆盖范围与代价，Blueprint 的 React 19 迁移，WKWebView 与 WebView2 的 CSS 差异。
    aliases: [组件库, headless, 无样式, react-aria-components, radix-ui, base-ui, ariakit, blueprint, fluentui, dockview, cmdk, tanstack, 许可证, license]
    source: >-
