interface:
  display_name: "课程包设计与课时对齐"
  short_description: >-
    按 golden-course-template 基准设计 v2 课程包、无环知识图谱与学习路径，按课时预算反推
    讲义篇幅与多题型配额，规划初级英语背题译文覆盖，并执行课程质量检查
  default_prompt: >-
    使用 $design-course-package 规划、审计或升级这门课程：先跑 audit-course-effort.mjs 与
    course:check 评估各知识点课时密度与结构问题，按预算拆分公式补齐讲义小节、实操锚点及多题型配额，
    初级英语同时核对阅读与听力的 study_translation 覆盖，
    再联动 $design-course-tts 检查原文分段、音频和逐字稿对齐并复验。
