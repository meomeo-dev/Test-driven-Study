    path: references/voices-billing-limits.md
    kind: reference
    summary: 两个音色 stella 与 tide、自动识别的语种、按计费字符收费的口径与价格（含限时折扣）、账号并发上限；价格与折扣会漂移，以当次查阅为准。
    source: >-
      https://api-docs.deepseek.com/zh-cn/guides/tts（音色、计费、限速，页面未标注更新日期）；https://api-docs.deepseek.com/zh-cn/quick_start/pricing（语音价格）；https://api-docs.deepseek.com/zh-cn/quick_start/rate_limit（并发按账号计）
