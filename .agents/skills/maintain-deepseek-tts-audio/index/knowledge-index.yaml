    title: DeepSeek 语音合成整段接口
    path: references/deepseek-tts-api.md
    kind: reference
    summary: 接口地址、Bearer 鉴权、请求体字段与取值、单次上限、PCM 回包与中途断开的处理；本 Skill 的请求模块按此实现。
