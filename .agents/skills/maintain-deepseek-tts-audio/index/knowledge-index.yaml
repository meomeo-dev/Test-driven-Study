  - id: error-handling
    title: 合成报错的类别与处理
    path: references/error-handling.md
    kind: reference
    summary: HTTP 状态到错误类别的对照、工具遇到各类别时的行为（重试、停止派发、停该音色）与处理方法；含官方未公开、按假设判定的项。
    source: >-
      https://api-docs.deepseek.com/zh-cn/guides/tts（400、429、503、504 与中途断开）；https://api-docs.deepseek.com/zh-cn/quick_start/error_codes（401、402、413、422、500）；session-evidence（2026-11-17 实测音色不存在与没有可朗读文本均为 HTTP 400）
