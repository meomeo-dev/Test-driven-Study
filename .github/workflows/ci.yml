name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Full verification gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install npm dependencies
        run: npm ci

      - name: Cache sqlc v1.31.1 for offline DB codegen
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 version

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full repository acceptance gate
        run: npm run check

      - name: Run Go vet
        run: go vet ./...

      - name: Run course audit unit tests
        run: node --test scripts/course-audit.test.mjs scripts/audit-course-effort.test.mjs

      - name: Audit bundled course packages
        run: |
          npm run course:audit -- courses/golden-course-template
          npm run course:audit -- --strict courses/beginner-english
          npm run course:audit -- --strict courses/elementary-chinese
