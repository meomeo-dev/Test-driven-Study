        type: { type: string, enum: [single_choice, multiple_choice, true_false, numeric] }
        stem: { $ref: '#/components/schemas/RichText' }
        options: { type: array, items: { $ref: '#/components/schemas/CourseOption' } }
    ClozeContent:
      type: object
      required: [passage, blanks]
      properties:
        passage: { $ref: '#/components/schemas/RichText' }
        blanks: { type: array, items: { $ref: '#/components/schemas/BlankPrompt' } }
    ListeningContent:
      type: object
      required: [sub_questions]
      properties:
        sub_questions: { type: array, items: { $ref: '#/components/schemas/SubQuestionPrompt' } }
    ReadingContent:
      type: object
      required: [passage, sub_questions]
      properties:
        passage: { $ref: '#/components/schemas/RichText' }
        sub_questions: { type: array, items: { $ref: '#/components/schemas/SubQuestionPrompt' } }
    WritingContent:
      type: object
      required: [subtype, requirements]
      properties:
        subtype: { type: string, enum: [sentence_making, short_essay, full_essay] }
        requirements: { type: array, items: { type: string } }
        min_words: { type: integer }
        max_words: { type: integer }
    TranslationContent:
      type: object
      required: [direction, source_text]
      properties:
        direction: { type: string, enum: [en_to_zh, zh_to_en] }
        source_text: { type: string }
        source_text_tts: { $ref: '#/components/schemas/TTSConfig' }
    QuestionContent:
      oneOf:
        - $ref: '#/components/schemas/ClozeContent'
        - $ref: '#/components/schemas/ListeningContent'
        - $ref: '#/components/schemas/ReadingContent'
        - $ref: '#/components/schemas/WritingContent'
        - $ref: '#/components/schemas/TranslationContent'
    CourseGrading:
      type: object
      properties:
        choice_ids: { type: array, items: { type: string } }
        boolean: { type: boolean }
        value: { type: [string, boolean] }
        absolute_tolerance: { type: string }
    CourseItemReviewBase:
      type: object
      required: [id, stem]
      properties:
        id: { type: string }
        stem: { $ref: '#/components/schemas/RichText' }
        chapter: { type: string }
        image: { type: string }
        analysis: { $ref: '#/components/schemas/RichText' }
        explanation: { type: string }
        explanation_audio: { type: array, items: { $ref: '#/components/schemas/ContentSegment' } }
        hint: { type: string }
    CourseItemMediaFields:
      type: object
      properties:
        audio:
          oneOf:
            - { type: string }
            - type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [dialogue, passage, recording] }
                voice_male: { type: string, enum: [stella, tide] }
                voice_female: { type: string, enum: [stella, tide] }
                src: { type: string }
        transcript:
          oneOf:
            - { type: string }
            - { type: array, items: { $ref: '#/components/schemas/TranscriptLine' } }
    SingleChoiceItemReview:
      allOf:
        - $ref: '#/components/schemas/CourseItemReviewBase'
        - $ref: '#/components/schemas/CourseItemMediaFields'
        - type: object
          required: [type, options, grading]
          properties:
            type: { type: string, enum: [single_choice] }
            options: { type: array, items: { $ref: '#/components/schemas/CourseOption' } }
            grading: { $ref: '#/components/schemas/CourseGrading' }
    MultipleChoiceItemReview:
      allOf:
        - $ref: '#/components/schemas/CourseItemReviewBase'
        - $ref: '#/components/schemas/CourseItemMediaFields'
        - type: object
          required: [type, options, grading]
          properties:
            type: { type: string, enum: [multiple_choice] }
            options: { type: array, items: { $ref: '#/components/schemas/CourseOption' } }
            grading: { $ref: '#/components/schemas/CourseGrading' }
    TrueFalseItemReview:
      allOf:
        - $ref: '#/components/schemas/CourseItemReviewBase'
        - $ref: '#/components/schemas/CourseItemMediaFields'
        - type: object
          required: [type, grading]
          properties:
            type: { type: string, enum: [true_false] }
            options: { type: array, items: { $ref: '#/components/schemas/CourseOption' } }
            grading: { $ref: '#/components/schemas/CourseGrading' }
    NumericItemReview:
      allOf:
        - $ref: '#/components/schemas/CourseItemReviewBase'
        - $ref: '#/components/schemas/CourseItemMediaFields'
        - type: object
          required: [type, grading]
          properties:
            type: { type: string, enum: [numeric] }
            grading: { $ref: '#/components/schemas/CourseGrading' }
    SubQuestionReview:
      oneOf:
        - $ref: '#/components/schemas/SingleChoiceItemReview'
        - $ref: '#/components/schemas/MultipleChoiceItemReview'
        - $ref: '#/components/schemas/TrueFalseItemReview'
        - $ref: '#/components/schemas/NumericItemReview'
      discriminator:
        propertyName: type
        mapping:
          single_choice: '#/components/schemas/SingleChoiceItemReview'
          multiple_choice: '#/components/schemas/MultipleChoiceItemReview'
          true_false: '#/components/schemas/TrueFalseItemReview'
          numeric: '#/components/schemas/NumericItemReview'
    ClozeItemReview:
      allOf:
        - $ref: '#/components/schemas/CourseItemReviewBase'
        - type: object
          required: [type, passage, blanks]
          properties:
            type: { type: string, enum: [cloze] }
            passage: { $ref: '#/components/schemas/RichText' }
            passage_tts: { $ref: '#/components/schemas/TTSConfig' }
            blanks:
              type: array
              items:
                type: object
                required: [index, options, grading]
                properties:
                  index: { type: integer }
                  options: { type: array, items: { $ref: '#/components/schemas/CourseOption' } }
                  grading: { $ref: '#/components/schemas/CourseGrading' }
                  explanation: { $ref: '#/components/schemas/RichText' }
    ListeningItemReview:
      allOf:
        - $ref: '#/components/schemas/CourseItemReviewBase'
        - $ref: '#/components/schemas/CourseItemMediaFields'
        - type: object
          required: [type, sub_questions]
          properties:
            type: { type: string, enum: [listening] }
            passage: { $ref: '#/components/schemas/RichText' }
            sub_questions: { type: array, items: { $ref: '#/components/schemas/SubQuestionReview' } }
    ReadingItemReview:
      allOf:
        - $ref: '#/components/schemas/CourseItemReviewBase'
        - type: object
          required: [type, passage, sub_questions]
          properties:
            type: { type: string, enum: [reading_comprehension] }
            passage: { $ref: '#/components/schemas/RichText' }
            sub_questions: { type: array, items: { $ref: '#/components/schemas/SubQuestionReview' } }
    WritingItemReview:
      allOf:
        - $ref: '#/components/schemas/CourseItemReviewBase'
        - type: object
          required: [type, subtype, requirements]
          properties:
            type: { type: string, enum: [writing] }
            subtype: { type: string, enum: [sentence_making, short_essay, full_essay] }
            requirements: { type: array, items: { type: string } }
            keywords: { type: array, items: { type: string } }
            min_words: { type: integer }
            max_words: { type: integer }
            sample_response: { $ref: '#/components/schemas/RichText' }
            sample_response_tts: { $ref: '#/components/schemas/TTSConfig' }
            rubric: { type: object, additionalProperties: { type: integer } }
    TranslationItemReview:
      allOf:
        - $ref: '#/components/schemas/CourseItemReviewBase'
        - type: object
          required: [type, direction, source_text]
          properties:
            type: { type: string, enum: [translation] }
            direction: { type: string, enum: [en_to_zh, zh_to_en] }
            source_text: { type: string }
            source_text_tts: { $ref: '#/components/schemas/TTSConfig' }
            reference_translation: { type: string }
            reference_translation_tts: { $ref: '#/components/schemas/TTSConfig' }
            acceptable_alternates: { type: array, items: { type: string } }
            key_terms:
              type: array
              items:
                type: object
                required: [term]
                properties:
                  term: { type: string }
                  variants: { type: array, items: { type: string } }
    CourseItemReview:
      description: Authored item, including answer and explanation data. Returned only on review surfaces.
      oneOf:
        - $ref: '#/components/schemas/SingleChoiceItemReview'
        - $ref: '#/components/schemas/MultipleChoiceItemReview'
        - $ref: '#/components/schemas/TrueFalseItemReview'
        - $ref: '#/components/schemas/NumericItemReview'
        - $ref: '#/components/schemas/ClozeItemReview'
        - $ref: '#/components/schemas/ListeningItemReview'
        - $ref: '#/components/schemas/ReadingItemReview'
        - $ref: '#/components/schemas/WritingItemReview'
        - $ref: '#/components/schemas/TranslationItemReview'
      discriminator:
        propertyName: type
        mapping:
          single_choice: '#/components/schemas/SingleChoiceItemReview'
          multiple_choice: '#/components/schemas/MultipleChoiceItemReview'
          true_false: '#/components/schemas/TrueFalseItemReview'
          numeric: '#/components/schemas/NumericItemReview'
          cloze: '#/components/schemas/ClozeItemReview'
          listening: '#/components/schemas/ListeningItemReview'
          reading_comprehension: '#/components/schemas/ReadingItemReview'
          writing: '#/components/schemas/WritingItemReview'
          translation: '#/components/schemas/TranslationItemReview'
    WrittenFeedback:
      type: object
      required: [criteria, summary]
      properties:
        criteria:
          type: array
          items:
            type: object
            required: [name, points, max_points, comment]
            properties:
              name: { type: string }
              points: { type: integer }
              max_points: { type: integer }
              comment: { type: string }
        summary: { type: string }
    TTSConfig:
      type: object
      additionalProperties: false
      properties:
        voice:
          type: string
          enum: [stella, tide]
        text:
          type: string
        speed:
          type: number
    PinyinClips:
      type: array
      minItems: 1
      items:
        type: string
        pattern: '^(?:[a-z]{1,8}[1-5]){1,3}$'
    ContentSegment:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [text, speech, blank]
        text:
          type: string
        pinyin:
          $ref: '#/components/schemas/PinyinClips'
        tts:
          $ref: '#/components/schemas/TTSDeclaration'
        tts_text:
          type: string
        index:
          type: integer
    TTSProviderSettings:
      type: object
      additionalProperties: false
      required:
        - base_url
        - voices
        - default_voice
        - proxy_url
        - proxy_auth_configured
        - key_configured
        - storage
        - write_token
        - ready
      properties:
        base_url:
          type: string
        voices:
          type: array
          items:
            type: string
            enum: [stella, tide]
        default_voice:
          type: string
          enum: [stella, tide]
        proxy_url:
          type: string
        proxy_auth_configured:
          type: boolean
        key_configured:
          type: boolean
        storage:
          type: string
        write_token:
          type: string
        ready:
          type: boolean
    TTSProviderUpdate:
      type: object
      additionalProperties: false
      required:
        - base_url
        - default_voice
      properties:
        base_url:
          type: string
        default_voice:
          type: string
          enum: [stella, tide]
        api_key:
          type: string
        clear_key:
          type: boolean
        proxy_url:
          type: string
    TTSSynthesizeInput:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          type: string
          maxLength: 10000
        voice:
          type: string
          enum: [stella, tide]
          description: Uses the configured default voice when omitted.
        force:
          type: boolean
    TTSSynthesizeResult:
      type: object
      required: [key, voice, audio_url, cached, duration_ms]
      additionalProperties: false
      properties:
        key:
          type: string
        voice:
          type: string
          enum: [stella, tide]
        audio_url:
          type: string
        cached:
          type: boolean
        duration_ms:
          type: integer
