              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Request error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - *ref_4
        - name: chapter
          in: query
          schema:
            type: integer
            minimum: 0
        - name: state
          in: query
          schema:
            type: string
            enum:
              - all
              - unanswered
              - correct
              - incorrect
              - review
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: concept
          in: query
          description: Limit the list to items tagged with this concept of the unit
          schema:
            type: string
            maxLength: 64
  /api/practice/presentations:
    post:
      operationId: openPresentation
      responses:
        '200':
          description: Successful response
          content:
