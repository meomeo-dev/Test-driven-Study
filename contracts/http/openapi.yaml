components:
  schemas:
    CourseGuide:
      type: object
      required: [reviewed, sources, stages, hour_notes, booking_notes, total_hours]
      properties:
        reviewed: { type: string }
        sources:
          type: array
          items: { $ref: '#/components/schemas/CourseGuideSource' }
        stages:
          type: array
          items: { $ref: '#/components/schemas/CourseGuideStage' }
        hour_notes: { type: array, items: { type: string } }
        booking_notes: { type: array, items: { type: string } }
        total_hours:
          type: object
          additionalProperties: { type: integer }
    CourseGuideSource:
      type: object
      required: [id, title, date, publisher, url]
      properties:
        id: { type: string }
        title: { type: string }
        date: { type: string }
        publisher: { type: string }
        url: { type: string }
    CourseGuideStage:
      type: object
      required: [id, title, short, official, hours, pass, format, learning, exam, refs, prerequisites]
      properties:
        id: { type: integer }
        title: { type: string }
        short: { type: string }
        official: { type: string }
        hours:
          type: object
          additionalProperties: { type: integer }
        pass: { type: integer }
        format: { type: string }
        learning: { type: array, items: { type: string } }
        exam: { type: array, items: { type: string } }
        refs: { type: array, items: { type: string } }
        prerequisites:
          type: object
          required: [C1, C2]
          properties:
            C1: { type: array, items: { type: string } }
            C2: { type: array, items: { type: string } }
    CourseSummary:
      type: object
      required: [id, version, title, language, legacy, units, concept_count]
      properties:
        id: { type: string }
        version: { type: string }
        title: { type: string }
        language: { type: string }
        description: { type: string }
        logo: { type: string }
        legacy: { type: boolean }
        concept_count: { type: integer, minimum: 0 }
        units:
          type: array
          items: { $ref: '#/components/schemas/CourseUnitSummary' }
    ConceptGraph:
      type: object
      required: [course_id, version, units, concepts]
      properties:
        course_id: { type: string }
        version: { type: string }
        units:
          type: array
          items: { $ref: '#/components/schemas/ConceptUnit' }
        concepts:
          type: array
          items: { $ref: '#/components/schemas/ConceptStatus' }
    ConceptUnit:
      type: object
      required: [id, title, subject_id]
      properties:
        id: { type: string }
        title: { type: string }
        subject_id: { type: integer }
    ConceptState:
      type: string
      enum: [mastered, known, learning, ready, locked]
    ConceptStatus:
      type: object
      required: [id, title, unit_id, subject_id, estimated_minutes, prerequisites,
        item_count, attempted, correct, required_correct, known, unlocked, state]
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string }
        unit_id: { type: string }
        subject_id: { type: integer }
        lesson: { type: string }
        estimated_minutes: { type: integer }
        prerequisites:
          description: Alternative groups; every member of one group unlocks the concept
          type: array
          items: { type: array, items: { type: string } }
        item_count: { type: integer }
        attempted: { type: integer }
        correct: { type: integer }
        required_correct: { type: integer }
        known: { type: boolean, description: The learner's mark, even when overridden }
        unlocked: { type: boolean }
        state: { $ref: '#/components/schemas/ConceptState' }
    ConceptKnownRequest:
      type: object
      required: [known]
      additionalProperties: false
      properties:
        known: { type: boolean }
    LearningPathRequest:
      type: object
      required: [daily_minutes]
      additionalProperties: false
      properties:
        targets:
          type: array
          maxItems: 16
          uniqueItems: true
          items: { type: string }
        daily_minutes: { type: integer, minimum: 10, maximum: 480 }
    LearningPathView:
      type: object
      required: [path]
      properties:
        path:
          oneOf:
            - $ref: '#/components/schemas/LearningPath'
            - type: 'null'
    LearningPathStep:
      type: object
      required: [concept_id, title, unit_id, subject_id, estimated_minutes, group, state,
        done, unlocked, missing]
      properties:
        concept_id: { type: string }
        title: { type: string }
        unit_id: { type: string }
        subject_id: { type: integer }
        estimated_minutes: { type: integer }
        group: { type: array, items: { type: string } }
        state:
          type: string
          enum: [mastered, known, learning, ready, locked, missing]
        done: { type: boolean }
        unlocked: { type: boolean }
        missing: { type: boolean }
    LearningPath:
      type: object
      required: [id, course_id, course_version, targets, daily_minutes, created_at_ms, steps,
        mastered_steps, known_steps, remaining_steps, total_minutes, remaining_minutes,
        estimated_days, completed, stale, replan_suggested]
      properties:
        id: { type: integer }
        course_id: { type: string }
        course_version: { type: string }
        targets: { type: array, items: { type: string } }
        daily_minutes: { type: integer }
        created_at_ms: { type: integer }
        steps:
          type: array
          items: { $ref: '#/components/schemas/LearningPathStep' }
        mastered_steps: { type: integer }
        known_steps: { type: integer }
        remaining_steps: { type: integer }
        total_minutes: { type: integer }
        remaining_minutes: { type: integer }
        estimated_days: { type: integer }
        next_concept: { type: string }
        completed: { type: boolean }
        stale: { type: boolean }
        replan_suggested: { type: boolean }
    CourseRoadmap:
      type: object
      required: [courses]
      properties:
        courses:
          type: array
          items: { $ref: '#/components/schemas/RoadmapCourse' }
    PrerequisiteStrength:
      type: string
      enum: [required, recommended]
    RoadmapGroup:
      type: object
      required: [all_of, strength]
      properties:
        all_of: { type: array, items: { type: string } }
        strength: { $ref: '#/components/schemas/PrerequisiteStrength' }
    CourseState:
      type: string
      enum: [completed, in_progress, ready, waiting]
    RoadmapCourse:
      type: object
      required: [id, title, version, prerequisites, parallel_with, missing, concept_count,
        satisfied_concepts, marked_completed, completed, prerequisites_met, state]
      properties:
        id: { type: string }
        title: { type: string }
        version: { type: string }
        note: { type: string, description: README sentence that states the relations }
        prerequisites:
          description: Alternative groups; every installed member of one group meets them
          type: array
          items: { $ref: '#/components/schemas/RoadmapGroup' }
        parallel_with:
          description: Installed courses to study alongside, in both directions
          type: array
          items: { type: string }
        missing:
          description: Referenced courses that are not installed
          type: array
          items: { type: string }
        concept_count: { type: integer, minimum: 0 }
        satisfied_concepts: { type: integer, minimum: 0 }
        marked_completed: { type: boolean, description: The stored learner mark }
        completed: { type: boolean }
        prerequisites_met: { type: boolean }
        state: { $ref: '#/components/schemas/CourseState' }
    CourseCompletedRequest:
      type: object
      required: [completed]
      additionalProperties: false
      properties:
        completed: { type: boolean }
    RoadmapPathRequest:
      type: object
      additionalProperties: false
      properties:
        targets:
          type: array
          maxItems: 16
          uniqueItems: true
          items: { type: string }
    RoadmapPathView:
      type: object
      required: [path]
      properties:
        path:
          oneOf:
            - $ref: '#/components/schemas/RoadmapPath'
            - type: 'null'
    RoadmapStep:
      type: object
      required: [course_id, title, group, state, done, prerequisites_met, missing]
      properties:
        course_id: { type: string }
        title: { type: string }
        group: { type: array, items: { type: string } }
        strength: { $ref: '#/components/schemas/PrerequisiteStrength' }
        state:
          type: string
          enum: [completed, in_progress, ready, waiting, missing]
        done: { type: boolean }
        prerequisites_met: { type: boolean }
        missing: { type: boolean }
    RoadmapPath:
      type: object
      required: [id, targets, created_at_ms, steps, completed_steps, remaining_steps,
        completed, stale, replan_suggested]
      properties:
        id: { type: integer }
        targets: { type: array, items: { type: string } }
        created_at_ms: { type: integer }
        steps:
          type: array
          items: { $ref: '#/components/schemas/RoadmapStep' }
        completed_steps: { type: integer }
        remaining_steps: { type: integer }
        next_course: { type: string }
        completed: { type: boolean }
        stale: { type: boolean }
        replan_suggested: { type: boolean }
    CourseUnitSummary:
      type: object
      required: [id, title, has_practice, subject_id]
      properties:
        subject_id: { type: integer }
        id: { type: string }
        title: { type: string }
        has_practice: { type: boolean }
    ProgressState: *ref_2
    QuestionType:
      type: string
      enum:
        - single_choice
        - multiple_choice
        - true_false
        - numeric
        - cloze
        - listening
        - reading_comprehension
        - writing
        - translation
    ExamQuotaQuestionType:
      type: string
      enum:
        - single_choice
        - multiple_choice
        - true_false
    QuestionOption:
      type: object
      properties:
        sign: *ref_3
        item_title: *ref_6
        title: {}
        pinyin:
          $ref: '#/components/schemas/PinyinClips'
        tts:
          $ref: '#/components/schemas/TTSConfig'
      required:
        - sign
        - item_title
    TrueFalseOption:
      type: object
      properties:
        sign: *ref_3
        item_title: *ref_6
        boolean_value: { type: boolean }
        title: {}
        pinyin:
          $ref: '#/components/schemas/PinyinClips'
        tts:
          $ref: '#/components/schemas/TTSConfig'
      required:
        - sign
        - item_title
    QuestionMediaFields:
