  /api/llm/chat:
    post:
      operationId: chatWithQuestion
      description: >-
        Stream question-scoped AI replies as newline-delimited JSON. A status
        event starts the stream, delta events append text, and a done event
        supplies the complete reply and retrieved official sources. An error
        event is terminal. Disconnecting cancels the upstream request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionChatInput'
      responses:
        '200':
          description: Reply events, terminated by done or error
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/QuestionChatEvent'
        '400':
          description: Invalid question or bounded conversation input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Question does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: LLM configuration is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/llm/conversations:
    get:
      operationId: listConversations
      parameters:
        - in: query
          name: question_id
          schema: { type: integer, format: int64, minimum: 0 }
          description: Zero or omitted lists all questions
        - in: query
          name: before
          schema: { type: string }
      responses:
        '200':
          description: Most recently updated conversations, at most 50 per page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPage'
        '400':
          description: Invalid filter or cursor
    post:
      operationId: createConversation
      description: Idempotently create an empty question-scoped conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, question_id]
              properties:
                id: { type: string, format: uuid }
                question_id: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Created or existing conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationRecord'
        '400':
          description: Invalid identifier
        '404':
          description: Question not found
        '409':
          description: Identifier belongs to a different question
  /api/llm/conversations/coverage:
    get:
      operationId: getConversationCoverage
      description: >-
        Question-level counts of conversations containing saved messages, across
        the full subject. Empty conversations are excluded. No transcripts or
        history pagination are involved.
      parameters:
        - in: query
          name: subject
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Questions with saved conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationCoverage'
        '400':
          description: Invalid subject
  /api/llm/conversations/{conversation}:
    parameters:
      - in: path
        name: conversation
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getConversation
      responses:
        '200':
          description: Saved messages including partial interrupted replies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationRecord'
        '404':
          description: Conversation not found
  /api/llm/conversations/{conversation}/messages:
    parameters:
      - in: path
        name: conversation
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: sendConversationMessage
      description: >-
        Persist a new turn and stream reply events. History and question facts
        come from the server. Repeating a completed turn ID returns its saved
        reply; accepted interrupted requests are never automatically replayed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, text]
              properties:
                id: { type: string, format: uuid }
                text: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: NDJSON events terminated by done or error
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/QuestionChatEvent'
        '400':
          description: Invalid message or conversation length limit
        '404':
          description: Conversation not found
        '409':
          description: Active turn or previously accepted noncompleted turn ID
        '503':
          description: LLM configuration is unavailable
