openapi: 3.1.0
info:
  title: Test-driven Study HTTP API
  version: 0.1.0
paths:
  /api/courses:
    get:
      operationId: listCourses
      responses:
        '200':
          description: Installed course catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CourseSummary' }
        default: &course_error
          description: Course request failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/guide:
    get:
      operationId: readGuide
      parameters:
        - { name: subject, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Guide for the selected course
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseGuide' }
        default: *course_error
  /api/courses/{course}/concepts:
    parameters:
      - { name: course, in: path, required: true, schema: { type: string } }
    get:
      operationId: readConceptGraph
      responses:
        '200':
          description: Concepts of the active course version with live states
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConceptGraph' }
        default: *course_error
  /api/courses/{course}/concepts/{concept}/known:
    parameters:
      - { name: course, in: path, required: true, schema: { type: string } }
      - { name: concept, in: path, required: true, schema: { type: string } }
    put:
      operationId: setConceptKnown
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConceptKnownRequest' }
      responses:
        '200':
          description: Updated concept graph
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConceptGraph' }
        default: *course_error
  /api/courses/{course}/learning-path:
    parameters:
      - { name: course, in: path, required: true, schema: { type: string } }
    get:
      operationId: readLearningPath
      responses:
        '200':
          description: Active learning path, or null
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningPathView' }
        default: *course_error
    post:
      operationId: createLearningPath
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LearningPathRequest' }
      responses:
        '201':
          description: New active learning path; the previous one is archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningPath' }
        default: *course_error
  /api/courses/{course}/completed:
    parameters:
      - { name: course, in: path, required: true, schema: { type: string } }
    put:
      operationId: setCourseCompleted
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseCompletedRequest' }
      responses:
        '200':
          description: Updated course roadmap
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseRoadmap' }
        default: *course_error
  /api/roadmap:
    get:
      operationId: readCourseRoadmap
      responses:
        '200':
          description: Active courses with relations, completion and advisory states
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseRoadmap' }
        default: *course_error
  /api/roadmap/path:
    get:
      operationId: readRoadmapPath
      responses:
        '200':
          description: Active route across courses, or null
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoadmapPathView' }
        default: *course_error
    post:
      operationId: createRoadmapPath
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoadmapPathRequest' }
      responses:
        '201':
          description: New active route; the previous one is archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoadmapPath' }
        default: *course_error
  /api/courses/{course}/versions/{version}/assets/{asset}:
    parameters:
      - { name: course, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: string } }
      - { name: asset, in: path, required: true, schema: { type: string } }
    get:
      operationId: readCourseAsset
      responses:
        '200':
          description: Referenced media from an installed version
          content:
            'image/*':
              schema: { type: string, format: binary }
            audio/mpeg:
              schema: { type: string, format: binary }
            text/plain:
              schema: { type: string }
        default: *course_error
  /api/study/overview:
    get:
      operationId: getOverview
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectOverview'
        '400':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - &ref_0
