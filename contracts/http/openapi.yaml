      parameters:
        - name: presentation
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerInput'
  /api/practice/presentations/{presentation}/feedback:
    post:
      operationId: evaluateWrittenAttempt
      description: Requests optional AI feedback for a saved writing or translation attempt.
      parameters:
        - name: presentation
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Advisory feedback. The saved local score is unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WrittenFeedback' }
        '400':
          description: The attempt is not a writing or translation response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Attempt not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Request conflicts with saved state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Internal server error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Feedback could not be completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: LLM is not configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/study/exposures:
    post:
      operationId: recordExposure
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
