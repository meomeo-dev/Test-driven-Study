            $ref: '#/components/schemas/ContentSegment'
        skill: *ref_6
        difficulty: *ref_3
        tags: *ref_6
        licence_id: *ref_3
        subject_id: *ref_3
        chapter_id: *ref_3
        chapter_name: *ref_6
        sub_chapter_id: *ref_3
        sub_chapter_name: *ref_6
        course_id: *ref_3
        course_name: *ref_6
        sort: *ref_3
