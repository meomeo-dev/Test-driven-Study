        '500':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - *ref_0
        - name: chapter
          in: query
          required: false
          schema: &ref_3
            type: integer
            format: int64
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - all
              - unlearned
              - review
              - mastered
        - name: q
          in: query
          required: false
          schema: &ref_6
            type: string
  /api/questions/{id}:
    get:
      operationId: getQuestion
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionDetail'
        '400':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - &ref_1
          name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
  /api/questions/{id}/progress:
    put:
      operationId: setProgress
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: &ref_2
                    type: string
                    enum:
                      - unlearned
                      - review
                      - mastered
                required:
                  - state
        '400':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - *ref_1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state: *ref_2
              required:
                - state
  /api/study/cursor:
    put:
      operationId: setCursor
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved:
                    type: boolean
                required:
                  - saved
        '400':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject_id:
                  type: integer
                  minimum: 1
                question_id: *ref_3
